[project]
name = "otela"
version = "0.1.0"
description = "OpenTelemetry analytics & data formatting for agent traces"
authors = [
    { name = "zach-blumenfeld", email = "zach.blumenfeld@neo4j.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=15.0.0",
    "orjson>=3.10.0",
]

[project.scripts]
otela = "otela.cli:main"

[project.optional-dependencies]
pandas = ["pandas>=2.1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pandas>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
