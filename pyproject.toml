[project]
name = "otela"
version = "0.2.1"
description = "Format OpenTelemetry agent traces for analytics, ML, and context graphs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Zach Blumenfeld", email = "zach.blumenfeld@neo4j.com" },
]
requires-python = ">=3.11"
keywords = [
    "opentelemetry",
    "otel",
    "agent",
    "traces",
    "observability",
    "llm",
    "agentic",
    "openinference",
    "analytics",
    "parquet",
    "arrow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "pyarrow>=15.0.0",
    "orjson>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/decision-graph/otela"
Repository = "https://github.com/decision-graph/otela"
Issues = "https://github.com/decision-graph/otela/issues"

[project.scripts]
otela = "otela.cli:main"

[project.optional-dependencies]
pandas = ["pandas>=2.1.0"]
ml = ["torch>=2.2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pandas>=2.1.0",
    "torch>=2.2.0",
]
fixtures = [
    # Used only by scripts/generate_fixtures.py to produce real-trace fixtures.
    # Install with: uv sync --group fixtures
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "openinference-instrumentation-langchain>=0.1.20",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-api>=1.27.0",
    # Google ADK + LiteLLM lets us drive ADK without GCP/Vertex.
    # ADK's OTel emission is independent of the model backend.
    "google-adk>=0.3.0",
    "litellm>=1.50.0",
]

[build-system]
# 1.26+ supports PEP 639 license / license-files.
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Tests, scripts, and committed fixtures are repo-only — keep them out of
# the wheel that goes to PyPI.
packages = ["src/otela"]

[tool.hatch.build.targets.sdist]
include = [
    "src/otela",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
