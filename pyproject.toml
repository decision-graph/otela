[project]
name = "otela"
version = "0.1.0"
description = "OpenTelemetry analytics & data formatting for agent traces"
authors = [
    { name = "zach-blumenfeld", email = "zach.blumenfeld@neo4j.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=15.0.0",
    "orjson>=3.10.0",
]

[project.scripts]
otela = "otela.cli:main"

[project.optional-dependencies]
pandas = ["pandas>=2.1.0"]
ml = ["torch>=2.2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pandas>=2.1.0",
    "torch>=2.2.0",
]
fixtures = [
    # Used only by scripts/generate_fixtures.py to produce real-trace fixtures.
    # Install with: uv sync --group fixtures
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "openinference-instrumentation-langchain>=0.1.20",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-api>=1.27.0",
    # Google ADK + LiteLLM lets us drive ADK without GCP/Vertex.
    # ADK's OTel emission is independent of the model backend.
    "google-adk>=0.3.0",
    "litellm>=1.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
